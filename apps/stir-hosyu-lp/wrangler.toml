# stir-hosyu-lp — the Stir Hosyu Symbol landing page, hosted on Cloudflare Workers
# (Static Assets). Assets-only Worker (no `main`): Cloudflare serves ./public directly,
# so there is no build step and the package declares no dependencies.
#
# Deployed via Cloudflare Workers Builds (Git-connected — NOT GitHub Actions, so no
# Cloudflare token is stored in GitHub). Configure this Worker once in the Cloudflare
# dashboard (Workers & Pages → connect the nemtus/apps repo) with:
#   Root directory:    apps/stir-hosyu-lp
#   Build command:     (none — static)
#   Deploy command:    npx wrangler deploy
#   Build watch paths: apps/stir-hosyu-lp/*   (so only this site rebuilds)
#   Production branch: main   (PRs get preview URLs; ensure Preview URLs are enabled)
name = "nemtus-stir-hosyu-lp"
compatibility_date = "2025-06-01"

# Custom domain (managed as code; attached by Workers Builds on deploy). Cloudflare
# creates the DNS record and the certificate itself when the domain is attached, so there
# is nothing to add to the nemtus.com zone by hand. The one constraint is that the
# hostname must not already have a CNAME record — a Custom Domain cannot be created on
# top of one.
routes = [{ pattern = "stir-hosyu.nemtus.com", custom_domain = true }]

[assets]
directory = "./public"
not_found_handling = "404-page" # serve /404.html for unmatched paths
