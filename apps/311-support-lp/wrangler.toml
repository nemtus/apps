# 311-support-lp — NEMTUS 3.11 Great East Japan Earthquake reconstruction-support donation
# site (311-support.nemtus.com), hosted on Cloudflare Workers (Static Assets).
# Assets-only Worker (no `main`): Cloudflare serves ./public directly, so there is no
# build step and the package declares no dependencies.
#
# This replaces the former WordPress + Elementor site on a rental server. The pages were
# re-implemented as plain HTML/CSS with a small script (public/assets/js/main.js) while
# keeping every public URL, including the two Japanese-slug pages under /front/.
#
# Deployed via Cloudflare Workers Builds (Git-connected — NOT GitHub Actions, so no
# Cloudflare token is stored in GitHub). Configure this Worker once in the Cloudflare
# dashboard (Workers & Pages → connect the nemtus/apps repo) with:
#   Root directory:    apps/311-support-lp
#   Build command:     (none — static)
#   Deploy command:    npx wrangler deploy
#   Build watch paths: apps/311-support-lp/*   (so only this site rebuilds)
#   Production branch: main   (PRs get preview URLs; ensure Preview URLs are enabled)
name = "nemtus-311-support-lp"
compatibility_date = "2025-06-01"

# Phase 1 (current): served only on the default workers.dev URL
# (https://nemtus-311-support-lp.<account-subdomain>.workers.dev) while the old WordPress
# site keeps serving 311-support.nemtus.com. Every page's canonical URL already points at
# 311-support.nemtus.com, so search engines don't treat the workers.dev copy as a
# separate site.
workers_dev = true

# Phase 2 (cut-over, see README): delete the A record that points 311-support.nemtus.com
# at the rental server, then uncomment this. A Custom Domain cannot be created on top of
# an existing A/AAAA/CNAME record; Cloudflare creates the DNS record and certificate
# itself when the domain is attached. Set `workers_dev = false` at the same time so the
# workers.dev copy stops serving.
# routes = [
#   { pattern = "311-support.nemtus.com", custom_domain = true },
# ]

# Publish a Preview URL for each pull-request build.
preview_urls = true

[assets]
directory = "./public"
not_found_handling = "404-page" # serve /404.html for unmatched paths

# Required by `wrangler preview`, which Workers Builds runs for non-production branches.
# Deliberately empty: this site has no bindings or vars to carry over.
[previews]
