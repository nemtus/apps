name: ci-flea-market-functions

# CI for the flea-market Cloud Functions package (apps/flea-market/functions).
#
# ci-flea-market.yml's path filter already matches this directory, but its job runs in
# `apps/flea-market` and only installs and builds the frontend — so a change here would
# trigger a green run that never compiled the functions. This workflow covers that gap,
# and re-establishes apps/flea-market/.github/workflows/ci-functions.yml, inert since the
# monorepo import because GitHub only runs workflows from the repo-root .github/workflows/.
#
# There is no lint or format script in this package, so install + build is the whole
# surface. `build` is `tsc`, so it is the typecheck.
#
# Deployment is NOT covered. The Firebase CD workflows under apps/flea-market/.github/
# stay inert until their Workload Identity Federation trust is re-bound from
# nemtus/symbol-fest-market to nemtus/apps.
#
# Socket is integrated token-free, same as the other workflows here:
#   - Socket Firewall Free (`sfw`, mode: firewall-free) wraps `npm ci` and blocks
#     confirmed-malicious packages (incl. transitive) before they are fetched.
#   - The Socket GitHub App (repo-root socket.yml) comments on dependency-changing PRs.
on:
  push:
    branches: [main]
    paths:
      - "apps/flea-market/functions/**"
      - ".github/workflows/ci-flea-market-functions.yml"
  pull_request:
    paths:
      - "apps/flea-market/functions/**"
      - ".github/workflows/ci-flea-market-functions.yml"

concurrency:
  group: ci-flea-market-functions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flea-market/functions

jobs:
  verify:
    name: audit / build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # read-only job; don't leave GITHUB_TOKEN in git config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 22 is not a free choice here: engines.node selects the Cloud Functions
          # runtime, and Firebase offers only nodejs18/20/22. This package has no .nvmrc,
          # so the major is written out to match its engines.node.
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/flea-market/functions/package-lock.json
      # Audit the lockfile before install so a known-bad version is caught before its
      # (deferred) install scripts could ever run. `high` is achievable for this package:
      # the 7 remaining advisories are all moderate, led by a `uuid` finding whose only
      # fix is firebase-admin 14 — a major Dependabot holds on purpose, because
      # firebase-functions 7 peers firebase-admin ^11 || ^12 || ^13.
      - name: Audit before install
        run: npm audit --package-lock-only --audit-level=high
      - name: Socket Firewall (firewall-free, no token)
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - name: Install (clean, via Socket Firewall)
        run: sfw npm ci
      - name: Build (tsc)
        run: npm run build
